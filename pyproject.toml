[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-infrastructure"
version = "1.0.0"
description = "Comprehensive quantitative trading infrastructure"
authors = [{name = "Trading Infrastructure Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.3",
    "dask>=2023.8.1",
    "pyarrow>=13.0.0",
    "quantlib>=1.32",
    "apache-airflow>=2.7.0",
    "mysql-connector-python>=8.1.0",
    "clickhouse-driver>=0.2.6",
    "openai>=0.28.0",
    "langchain>=0.0.284",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.2",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "redis>=4.6.0",
    "pydantic>=2.3.0",
    "pytest>=7.4.2",
    "opentelemetry-api>=1.19.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"