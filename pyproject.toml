[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-infrastructure"
version = "1.0.0"
description = "Comprehensive quantitative trading infrastructure"
authors = [{name = "Trading Infrastructure Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
# Version ranges by stack. The pinned, tested installs are the requirements files:
# requirements_engine.txt, requirements_django.txt and requirements_dev.txt (both).
# requirements.txt pins the legacy stack below; see README.md.
dependencies = [
    # Trading engine runtime (src/)
    "pandas>=2.1.0",
    "numpy>=1.24.3",
    "pydantic>=2.3.0",
    "redis>=4.6.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.2",
]

[project.optional-dependencies]
# Django API, Celery and Channels (quantcore/, apps/)
django = [
    "Django>=4.2.7,<5.0",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.1",
    "django-environ>=0.11.2",
    "django-redis>=5.4.0",
    "psycopg2-binary>=2.9.7",
    "celery>=5.3.4",
    "channels>=4.0.0",
    "channels-redis>=4.1.0",
    "drf-spectacular>=0.26.5",
    "django-celery-beat>=2.5.0",
    "django-celery-results>=2.5.1",
    "yfinance>=0.2.18",
]
dev = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "pytest-django>=4.7.0",
]
# Original warehouse, Airflow and AI tooling (airflow/, dbt/, src/data connectors, src/ml)
legacy = [
    "dask>=2023.8.1",
    "pyarrow>=13.0.0",
    "quantlib>=1.32",
    "apache-airflow>=2.7.0",
    "mysql-connector-python>=8.1.0",
    "clickhouse-driver>=0.2.6",
    "openai>=0.28.0",
    "langchain>=0.0.284",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "opentelemetry-api>=1.19.0",
]

[tool.setuptools.packages.find]
# Code imports packages as src.*, apps.* and quantcore.*. Without this, setuptools
# treats src/ as a src-layout and would install core, services, ... as top-level packages.
include = ["src*", "apps*", "quantcore*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make src.*, apps.* and quantcore.* importable however pytest is invoked.
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
# Used by pytest-django for tests/django: SQLite in memory, no PostgreSQL or Redis needed.
DJANGO_SETTINGS_MODULE = "quantcore.settings_test"